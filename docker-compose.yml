services:
  mysql:
    image: mysql:8.4
    container_name: hackathon-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: hackathon
      MYSQL_USER: hackathon_user
      MYSQL_PASSWORD: hackathon_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - hackathon-mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  hackathon-mysql-data:
