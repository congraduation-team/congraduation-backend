spring.application.name=congraduation
spring.datasource.url=jdbc:mysql://localhost:3307/congraduation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=congraduation_user
spring.datasource.password=congraduation_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.forward-headers-strategy=framework
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,https://congraduation-frontend.vercel.app

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.jwt.secret=${APP_JWT_SECRET:change-this-jwt-secret-for-production-minimum-32-bytes}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:43200}

# 관리자 강의시간표 업로드
# data-dir: 런타임 override (classpath보다 우선)
# resources-dir: 로컬에서 src/main/resources/timetable-data 도 함께 갱신 (배포 jar에선 보통 skip)
app.timetable.data-dir=./data/timetable-data
app.timetable.resources-dir=./src/main/resources/timetable-data
# 관리자 업로드 시 GitHub Contents API로 timetable-data JSON 자동 커밋
# TIMETABLE_GITHUB_TOKEN: repo Contents 읽기/쓰기 권한이 있는 PAT
app.timetable.github.enabled=true
app.timetable.github.token=${TIMETABLE_GITHUB_TOKEN:}
app.timetable.github.owner=congraduation-team
app.timetable.github.repo=congraduation-backend
app.timetable.github.branch=main
app.timetable.github.path-prefix=src/main/resources/timetable-data
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
