spring.application.name=congraduation

# Local defaults are for docker-compose only. Override in production via env / .env.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/congraduation?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:congraduation_user}
spring.datasource.password=${DB_PASSWORD:congraduation_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# native: Tomcat RemoteIpValve가 X-Forwarded-For를 오른쪽부터 읽고 신뢰 프록시(사설망/loopback)만 건너뛴다.
# framework 방식은 클라이언트가 보낸 맨 왼쪽 값을 그대로 믿어 IP 위조로 로그인 시도 제한을 우회할 수 있다.
server.forward-headers-strategy=native

# 이 파일의 기본값은 운영 기준(안전한 쪽)이다. 로컬 개발 값은 application-local.properties 참고.
# CORS: 실제 프론트 주소만 허용. 도메인이 바뀌면 APP_CORS_ALLOWED_ORIGINS로 덮어쓴다(쉼표 구분, * 불가).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://congraduation-frontend.vercel.app}

# Swagger/OpenAPI: 운영에서는 끈다. 로컬은 local 프로필에서 켜진다.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# 로그인 시도 제한 (POST /api/auth/login). 초과 시 429 + Retry-After.
# ip-requests: IP별 전체 요청, ip-failures: IP별 실패, user-failures: 학번별 실패
app.login-rate-limit.ip-requests.max=${LOGIN_RATE_LIMIT_IP_REQUESTS_MAX:20}
app.login-rate-limit.ip-requests.window=${LOGIN_RATE_LIMIT_IP_REQUESTS_WINDOW:1m}
app.login-rate-limit.ip-failures.max=${LOGIN_RATE_LIMIT_IP_FAILURES_MAX:20}
app.login-rate-limit.ip-failures.window=${LOGIN_RATE_LIMIT_IP_FAILURES_WINDOW:15m}
app.login-rate-limit.user-failures.max=${LOGIN_RATE_LIMIT_USER_FAILURES_MAX:5}
app.login-rate-limit.user-failures.window=${LOGIN_RATE_LIMIT_USER_FAILURES_WINDOW:15m}

# 에러 응답에 예외 메시지·스택트레이스를 노출하지 않는다(Spring 기본값을 명시적으로 고정).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Production must set APP_JWT_SECRET (32+ chars). Local default is intentionally weak and for local only.
app.jwt.secret=${APP_JWT_SECRET:local-dev-only-change-me-to-a-long-random-secret}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:43200}

# 관리자 강의시간표 업로드
# data-dir: 런타임 override (classpath보다 우선)
# resources-dir: 로컬에서 src/main/resources/timetable-data 도 함께 갱신 (배포 jar에선 보통 skip)
app.timetable.data-dir=./data/timetable-data
app.timetable.resources-dir=./src/main/resources/timetable-data
# 관리자 업로드 시 GitHub Contents API로 timetable-data JSON 자동 커밋
# TIMETABLE_GITHUB_TOKEN: repo Contents 읽기/쓰기 권한이 있는 PAT (절대 커밋하지 말 것)
app.timetable.github.enabled=${TIMETABLE_GITHUB_ENABLED:false}
app.timetable.github.token=${TIMETABLE_GITHUB_TOKEN:}
app.timetable.github.owner=${TIMETABLE_GITHUB_OWNER:congraduation-team}
app.timetable.github.repo=${TIMETABLE_GITHUB_REPO:congraduation-backend}
app.timetable.github.branch=${TIMETABLE_GITHUB_BRANCH:main}
app.timetable.github.path-prefix=src/main/resources/timetable-data
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
