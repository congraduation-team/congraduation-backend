<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projectName}">Congraduation</title>
    <style>
        :root {
            --bg: #f5f1e8;
            --paper: #fffdf7;
            --ink: #1e2a2f;
            --muted: #687076;
            --line: #d8cfbf;
            --accent: #0b6e4f;
            --accent-soft: #dcefe5;
            --accent-strong: #083d31;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
            color: var(--ink);
            background:
                    radial-gradient(circle at top left, rgba(11, 110, 79, 0.10), transparent 32%),
                    linear-gradient(180deg, #f8f4ec 0%, var(--bg) 100%);
        }

        .page {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 40px 0 56px;
        }

        .hero {
            padding: 36px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: linear-gradient(135deg, rgba(255, 253, 247, 0.96), rgba(240, 248, 243, 0.96));
            box-shadow: 0 24px 60px rgba(33, 44, 38, 0.08);
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 14px;
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        h1 {
            margin: 0;
            font-size: clamp(38px, 8vw, 72px);
            line-height: 0.94;
            letter-spacing: -0.05em;
        }

        .tagline {
            max-width: 640px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-top: 24px;
        }

        .card {
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--paper);
            box-shadow: 0 10px 30px rgba(33, 44, 38, 0.05);
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .highlights,
        .links {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .highlights li,
        .links li {
            padding: 14px 0;
            border-top: 1px solid rgba(216, 207, 191, 0.8);
        }

        .highlights li:first-child,
        .links li:first-child {
            border-top: 0;
            padding-top: 0;
        }

        .links a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 700;
        }

        .method {
            display: inline-block;
            min-width: 52px;
            margin-right: 12px;
            color: var(--accent);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.06em;
        }

        .footer-note {
            margin-top: 16px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 26px;
            }
        }
    </style>
</head>
<body>
<main class="page">
    <section class="hero">
        <div class="eyebrow">PERSONAL PROJECT</div>
        <h1 th:text="${projectName}">Congraduation</h1>
        <p class="tagline" th:text="${tagline}">
            세종대학교 졸업요건 점검을 위한 개인 프로젝트
        </p>
    </section>

    <section class="grid">
        <article class="card">
            <h2>현재 포함된 기능</h2>
            <ul class="highlights">
                <li th:each="highlight : ${highlights}" th:text="${highlight}">기능 요약</li>
            </ul>
            <p class="footer-note">
                타임리프 기반 화면으로 점진 전환 중이며, 기존 REST API도 함께 유지합니다.
            </p>
        </article>

        <article class="card">
            <h2>바로가기</h2>
            <ul class="links">
                <li th:each="link : ${apiLinks}">
                    <span class="method" th:text="${link.method()}">GET</span>
                    <a th:href="${link.href()}" th:text="${link.label()}">링크</a>
                </li>
            </ul>
        </article>
    </section>
</main>
</body>
</html>
